name: EventStay CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  api-check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: server/package.json
      - run: npm install
      - name: Check API JavaScript syntax
        run: |
          node --check src/server.js
          node --check src/db.js
      - name: Check frontend JavaScript syntax
        working-directory: .
        run: node scripts/check-inline-js.mjs
