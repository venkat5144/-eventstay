services:
  db:
    image: postgres:17-alpine
    container_name: eventstay-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: eventstay
      POSTGRES_USER: eventstay
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-eventstay_dev_password}
    ports:
      - "5433:5432"
    volumes:
      - eventstay_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U eventstay -d eventstay"]
      interval: 5s
      timeout: 5s
      retries: 10
  api:
    build: ./server
    container_name: eventstay-api
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 5000
      DATABASE_URL: postgresql://eventstay:${POSTGRES_PASSWORD:-eventstay_dev_password}@db:5432/eventstay
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env}
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
volumes:
  eventstay_pgdata:
