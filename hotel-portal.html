<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#321f32"><title>EventStay · Hotel Desk</title><script src="api-config.js"></script>
<style>
:root{--ink:#30232f;--muted:#81747d;--paper:#f7f2ec;--line:#e8ddd4;--accent:#a94f3f}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif;padding:22px;min-height:100vh}.shell{max-width:760px;margin:auto}.brand{color:#a94f3f;font-size:11px;font-weight:800;letter-spacing:.2em}.head{background:#321f32;color:white;padding:25px 28px;border-radius:20px;margin-bottom:18px}.head h1{font:500 29px Georgia,serif;margin:10px 0 4px}.head p{margin:0;color:#d8cbd4;font-size:13px}.card{background:#fffdfa;border:1px solid var(--line);border-radius:17px;padding:22px;margin:14px 0}.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}label{display:block;font-size:12px;color:var(--muted);margin:10px 0 5px}input,select{width:100%;padding:12px;border:1px solid var(--line);border-radius:10px;font:inherit;background:white;color:var(--ink)}.field{flex:1;min-width:190px}button{border:0;border-radius:10px;padding:12px 16px;background:#321f32;color:white;font:600 13px system-ui;cursor:pointer}button.secondary{background:#f2e9e3;color:#493643}button:disabled{opacity:.5;cursor:not-allowed}.notice{padding:12px;border-radius:10px;background:#f7f0ea;color:#675963;font-size:13px;margin:12px 0}.error{background:#fff0ed;color:#9b3029}.success{background:#edf7ef;color:#23613a}video{width:100%;max-height:340px;background:#211b22;border-radius:12px;margin-top:12px}.allocation{border:1px solid var(--line);padding:14px;border-radius:12px;margin:10px 0}.allocation b{display:block;margin-bottom:4px}.muted{color:var(--muted);font-size:12px}#app[hidden],#login[hidden],#scanner[hidden],#result[hidden]{display:none}
</style></head><body><main class="shell">
<header class="head"><div class="brand">EVENTSTAY · HOTEL PORTAL</div><h1>Front desk check-in</h1><p>Verify the guest booking before confirming check-in and handing over keys.</p></header>
<section id="login" class="card"><h2>Hotel staff sign in</h2><form id="loginForm"><label>Email</label><input id="email" type="email" autocomplete="username" required><label>Password</label><input id="password" type="password" autocomplete="current-password" required><div class="row" style="margin-top:14px"><button id="loginBtn">Sign in</button></div></form><div id="loginMsg" class="notice" hidden></div></section>
<section id="app" hidden>
 <div class="card"><div class="row" style="justify-content:space-between"><div><b id="staffName">Hotel staff</b><div class="muted">Authorized hotel access</div></div><button class="secondary" id="logout">Sign out</button></div>
 <label>Select hotel</label><select id="hotel"></select></div>
 <section class="card"><h2>Scan guest QR</h2><p class="muted">Allow camera access, or enter the pass token manually.</p><div class="row"><button id="startScan">Start camera</button><button id="stopScan" class="secondary" disabled>Stop camera</button></div><video id="video" playsinline hidden></video><label>Manual QR token</label><div class="row"><input id="token" placeholder="Paste the 64-character pass token" autocomplete="off"><button id="verify">Verify</button></div><div id="scanMsg" class="notice" hidden></div></section>
 <section id="result" class="card" hidden><h2>Booking verification</h2><div id="guestDetails"></div><div id="allocations"></div><div id="confirmMsg" class="notice" hidden></div></section>
</section></main>
<script>
(()=>{
 const api=String(window.EVENTSTAY_API_BASE||'').replace(/\/$/,'');
 const $=id=>document.getElementById(id);let token='',hotels=[],stream=null,detector=null,raf=0,lastValue='';
 const show=(el,msg,type='')=>{el.hidden=false;el.className='notice '+type;el.textContent=msg};
 const request=async(path,opts={})=>{if(!api)throw Error('Backend URL is not configured.');const r=await fetch(api+path,{...opts,headers:{'Content-Type':'application/json',...(token?{Authorization:'Bearer '+token}:{}),...(opts.headers||{})}});const d=r.status===204?null:await r.json().catch(()=>({error:'Invalid server response'}));if(!r.ok)throw Error(d?.error||'Request failed ('+r.status+')');return d};
 function logout(){token='';sessionStorage.removeItem('eventstay-hotel-token');$('app').hidden=true;$('login').hidden=false;stopCamera()}
 async function enter(){const me=await request('/api/me');if(!me.user||!['hotel_owner','hotel_staff'].includes(me.user.role))throw Error('This login is not a hotel account.');const data=await request('/api/hotel/workspace');hotels=data.hotels||[];if(!hotels.length)throw Error('No hotel access is assigned to this account. Ask the event organizer.');$('staffName').textContent=me.user.name+' · '+me.user.role.replace('_',' ');$('hotel').innerHTML=hotels.map(h=>'<option value="'+h.id+'">'+h.name+' · '+h.role+'</option>').join('');$('login').hidden=true;$('app').hidden=false}
 $('loginForm').addEventListener('submit',async e=>{e.preventDefault();$('loginBtn').disabled=true;try{const d=await request('/api/auth/login',{method:'POST',body:JSON.stringify({email:$('email').value.trim(),password:$('password').value})});token=d.token;sessionStorage.setItem('eventstay-hotel-token',token);await enter()}catch(e){show($('loginMsg'),e.message,'error')}finally{$('loginBtn').disabled=false}});
 $('logout').onclick=logout;
 async function verify(raw){const value=String(raw||'').trim();if(!/^[a-f0-9]{64}$/i.test(value)){show($('scanMsg'),'QR token format is invalid.','error');return}stopCamera();$('token').value=value;$('result').hidden=true;$('scanMsg').hidden=true;try{const hotelId=$('hotel').value,d=await request('/api/hotel/'+hotelId+'/check-in/verify',{method:'POST',body:JSON.stringify({token:value})});$('guestDetails').innerHTML='<div class="notice success">Booking found at '+d.hotel+'. Verify the guest identity before confirming.</div><b>'+d.guest.name+'</b><div class="muted">'+d.guest.guest_count+' guest(s) · '+(d.guest.phone||'No phone')+'</div>';$('allocations').innerHTML='';d.allocations.forEach(a=>{const box=document.createElement('div');box.className='allocation';const b=document.createElement('b');b.textContent='Room '+a.room_number;const p=document.createElement('div');p.className='muted';p.textContent=a.check_in+' → '+a.check_out+' · '+a.status;box.append(b,p);if(a.status==='reserved'){const btn=document.createElement('button');btn.textContent='Confirm check-in';btn.onclick=()=>confirmCheckin(a.id,btn);box.append(btn)}else{const label=document.createElement('div');label.className='notice';label.textContent='Already checked in';box.append(label)}$('allocations').append(box)});$('confirmMsg').hidden=true;$('result').hidden=false}catch(e){show($('scanMsg'),e.message,'error')}}
 async function confirmCheckin(id,btn){if(!confirm('Confirm check-in for this room? Only confirm after verifying the guest.'))return;btn.disabled=true;try{const d=await request('/api/hotel/'+$('hotel').value+'/check-in/'+id+'/confirm',{method:'POST',body:'{}'});show($('confirmMsg'),d.message||'Check-in confirmed.','success');btn.remove()}catch(e){show($('confirmMsg'),e.message,'error');btn.disabled=false}}
 $('verify').onclick=()=>verify($('token').value);
 async function startCamera(){if(!('BarcodeDetector'in window)){show($('scanMsg'),'Camera QR scanning is not supported by this browser. Use the manual token field or open this page in a supported Chrome browser.','error');return}try{detector=new BarcodeDetector({formats:['qr_code']});stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:{ideal:'environment'}},audio:false});$('video').srcObject=stream;$('video').hidden=false;await $('video').play();$('startScan').disabled=true;$('stopScan').disabled=false;const scan=async()=>{if(!stream)return;try{const codes=await detector.detect($('video'));if(codes.length&&codes[0].rawValue&&codes[0].rawValue!==lastValue){lastValue=codes[0].rawValue;await verify(lastValue);return}}catch{}raf=requestAnimationFrame(scan)};scan()}catch(e){show($('scanMsg'),'Could not start camera: '+e.message,'error');stopCamera()}}
 function stopCamera(){if(raf)cancelAnimationFrame(raf);raf=0;if(stream){stream.getTracks().forEach(t=>t.stop());stream=null}$('video').srcObject=null;$('video').hidden=true;$('startScan').disabled=false;$('stopScan').disabled=true;lastValue=''}
 $('startScan').onclick=startCamera;$('stopScan').onclick=stopCamera;
 token=sessionStorage.getItem('eventstay-hotel-token')||'';if(token){enter().catch(e=>{logout();show($('loginMsg'),e.message,'error')})}
 if(!api)show($('loginMsg'),'Backend URL is not configured yet.','error');
})();
</script></body></html>
